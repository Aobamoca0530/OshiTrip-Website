name: Deploy iPhone and mobile web app
on:
  push:
    branches: [main]
    paths: ['oshitrip/**', '.github/workflows/mobile-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oshitrip
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0
          package_json_file: oshitrip/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:check
      - run: pnpm typecheck
      - run: pnpm build:mobile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config mobile/playwright.config.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: oshitrip/mobile-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
