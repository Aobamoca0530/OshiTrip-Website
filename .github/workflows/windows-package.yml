name: Package Windows portable app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: oshitrip
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0
          package_json_file: oshitrip/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:windows
      - name: Test the packaged executable
        run: node scripts/test-windows-package.mjs
      - name: Build and test standalone cleanup tool
        run: pnpm package:cleanup
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: OshiTrip-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
