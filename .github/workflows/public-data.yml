name: Daily official updates and small-batch publication
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Run the daily pipeline without publishing snapshots
        type: boolean
        default: false
  schedule:
    # 22:00 China / 23:00 Japan (14:00 UTC). GitHub scheduling may be delayed.
    - cron: "0 14 * * *"
permissions:
  contents: write
concurrency:
  group: public-data-publisher
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'Aobamoca0530/OshiTrip-Website'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: oshitrip
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0
          package_json_file: oshitrip/package.json
      - run: pnpm install --frozen-lockfile
      - name: Install collector browser
        run: pnpm exec playwright install --with-deps chromium
      - id: maintain
        name: Check index updates and publish a bounded batch
        run: |
          if [ "$PUBLISH_SNAPSHOTS" = "true" ]; then
            xvfb-run --auto-servernum pnpm maintain:public --publish
            # Only drain today's already-discovered changes in small batches.
            # Continuations never rescan indexes or retry blocked origins.
            while node --input-type=module -e 'import fs from "node:fs"; const r = JSON.parse(fs.readFileSync("var/public-crawler/workflow-report.json", "utf8")); process.exit(r.updates?.continuation_urls?.length ? 0 : 1)'; do
              xvfb-run --auto-servernum pnpm maintain:public --continue-updates --publish
            done
          else
            xvfb-run --auto-servernum pnpm maintain:public
          fi
        env:
          PUBLISH_SNAPSHOTS: ${{ github.ref == 'refs/heads/main' && inputs.validate_only != true }}
          CRAWLER_REQUIRE_BROWSER_SUCCESS: ${{ inputs.validate_only && 'true' || 'false' }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVENT_TRANSLATION_PROVIDER: ${{ vars.EVENT_TRANSLATION_PROVIDER || 'auto' }}
          EVENT_TRANSLATION_MODEL: ${{ vars.EVENT_TRANSLATION_MODEL }}
          EVENT_TRANSLATION_LIMIT: 20
          EVENT_REVIEW_PROVIDER: ${{ vars.EVENT_REVIEW_PROVIDER || 'auto' }}
          EVENT_REVIEW_MODEL: ${{ vars.EVENT_REVIEW_MODEL }}
          EVENT_REVIEW_LIMIT: 20
          CRAWLER_IMAGE_RULES: "true"
          IMAGE_RULE_PROVIDER: ${{ vars.IMAGE_RULE_PROVIDER }}
          IMAGE_RULE_MODEL: ${{ vars.IMAGE_RULE_MODEL }}
          CRAWLER_IMAGE_LIMIT: 8
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: public-crawler-report
          path: |
            oshitrip/var/public-crawler/workflow-report.json
            oshitrip/var/public-crawler/report.json
            oshitrip/var/public-crawler/assistant-queue.json
            oshitrip/var/public-crawler/observations.json
            oshitrip/var/public-crawler/ticket-products-report.json
            oshitrip/var/public-crawler/discovery-review-report.json
            oshitrip/var/public-crawler/image-review-report.json
            oshitrip/var/public-crawler/runs/
            oshitrip/var/public-crawler/update-batches/
          retention-days: 14
