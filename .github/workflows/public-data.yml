name: Update public announcements and merchandise images
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Run the daily pipeline without publishing snapshots
        type: boolean
        default: false
  schedule:
    # 09:17 China / 10:17 Japan. GitHub scheduling may be delayed.
    - cron: "17 1 * * *"
permissions:
  contents: write
concurrency:
  group: public-data-publisher
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'Aobamoca0530/OshiTrip-Website'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: oshitrip
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0
          package_json_file: oshitrip/package.json
      - run: pnpm install --frozen-lockfile
      - name: Install collector browser
        run: pnpm exec playwright install --with-deps chromium
      - id: maintain
        run: pnpm maintain:public
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVENT_TRANSLATION_PROVIDER: ${{ vars.EVENT_TRANSLATION_PROVIDER || 'auto' }}
          EVENT_TRANSLATION_MODEL: ${{ vars.EVENT_TRANSLATION_MODEL }}
          EVENT_TRANSLATION_LIMIT: 24
          EVENT_REVIEW_PROVIDER: ${{ vars.EVENT_REVIEW_PROVIDER || 'auto' }}
          EVENT_REVIEW_MODEL: ${{ vars.EVENT_REVIEW_MODEL }}
          EVENT_REVIEW_LIMIT: 24
          CRAWLER_IMAGE_RULES: "true"
          IMAGE_RULE_PROVIDER: ${{ vars.IMAGE_RULE_PROVIDER }}
          IMAGE_RULE_MODEL: ${{ vars.IMAGE_RULE_MODEL }}
          CRAWLER_IMAGE_LIMIT: 4
      - name: Verify browser collection
        if: always() && steps.maintain.outcome != 'skipped'
        run: node scripts/check-browser-collection.mjs
        env:
          CRAWLER_REQUIRE_BROWSER_SUCCESS: ${{ inputs.validate_only && 'true' || 'false' }}
      - name: Publish validated snapshots
        if: github.ref == 'refs/heads/main' && inputs.validate_only != true
        run: |
          git add src/data/catalog.json src/data/announcements.json src/data/source-status.json src/data/public-meta.json scripts/crawler/excluded-sources.json ../data/public-v1.json ../data/public-v2.json ../data/public-v3.json ../data/public-v4.json
          git add supabase/seed.sql supabase/releases-seed.sql supabase/stores-seed.sql supabase/setup-new-project.sql
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "data: refresh official announcements and image links"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: public-crawler-report
          path: |
            oshitrip/var/public-crawler/workflow-report.json
            oshitrip/var/public-crawler/report.json
            oshitrip/var/public-crawler/assistant-queue.json
            oshitrip/var/public-crawler/observations.json
          retention-days: 14
