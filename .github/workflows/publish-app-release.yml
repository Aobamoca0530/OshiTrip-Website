name: Publish verified app packages
on:
  workflow_dispatch:
    inputs:
      desktop_run:
        description: Successful desktop artifact run ID
        required: true
      android_run:
        description: Successful signed Android artifact run ID
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.19.0
      - name: Verify provenance, download, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RUN: ${{ inputs.desktop_run }}
          ANDROID_RUN: ${{ inputs.android_run }}
        run: node oshitrip/scripts/publish-app-release.mjs
